<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jste offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f7f8fb;
        color: #1b2a4a;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
      }
      p {
        line-height: 1.6;
        color: #43506b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jste offline</h1>
      <p>
        Tuto stránku se nepodařilo načíst, protože zařízení nemá připojení k internetu a stránka
        zatím není uložena v offline paměti aplikace.
      </p>
      <p>
        Otevřete prosím aplikaci znovu, až budete online. Lekce, které jste už jednou otevřeli,
        zůstávají dostupné i bez připojení.
      </p>
    </main>
  </body>
</html>
